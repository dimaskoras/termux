<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOCTURNE — music player</title><style>
*{box-sizing:border-box}body{--a:#a38cff;margin:0;padding:16px 18px 24px;width:100%;min-width:0;background:linear-gradient(145deg,#1b1936,#101427 70%,#101a2b);color:#f6f5ff;font:13px system-ui,sans-serif;overflow:hidden}.head,.main,.times,.controls,.foot{display:flex;align-items:center;justify-content:space-between}.head{margin-bottom:15px}.brand{font-size:10px;color:#d6cffc}.brand em{font-style:normal;color:var(--a)}.pill{color:#abaacb;font-size:10px}.main{gap:16px;justify-content:flex-start;margin-bottom:18px}.cover{position:relative;width:clamp(94px,27vw,122px);height:clamp(94px,27vw,122px);flex:none;overflow:hidden;border-radius:16px;background:radial-gradient(circle at 25% 25%,#ffffff29,transparent 48%),linear-gradient(130deg,var(--a),#27204d 86%);display:flex;align-items:center;justify-content:center}.disc{width:75%;height:75%;border-radius:50%;background:repeating-radial-gradient(#17132c 0 6px,#31274d 7px 9px);border:3px solid #ffffff35;display:flex;align-items:center;justify-content:center;animation:spin 5s linear infinite;animation-play-state:paused}.disc:after{content:"";width:13px;height:13px;background:var(--a);border:4px solid #f2edff;border-radius:50%}body.playing .disc{animation-play-state:running}.bars{position:absolute;bottom:9px;left:9px;display:flex;align-items:flex-end;gap:3px;height:17px}.bars b{width:3px;height:4px;background:#fff;border-radius:4px;animation:eq .65s ease-in-out infinite alternate;animation-play-state:paused}.bars b:nth-child(2){animation-delay:-.35s}.bars b:nth-child(3){animation-delay:-.2s}.bars b:nth-child(4){animation-delay:-.5s}.bars b:nth-child(5){animation-delay:-.25s}body.playing .bars b{animation-play-state:running}.info{min-width:0;flex:1}.eyebrow{font-size:10px;letter-spacing:1.2px;color:var(--a);font-weight:700}.info h2{font-size:clamp(20px,5vw,25px);line-height:1.18;margin:8px 0 5px;}.artist{color:#b3b3cc;font-size:12px;margin:0 0 10px}.label{display:inline-block;color:#d2cce8;padding:4px 7px;font-size:10px;}.seek,.vol{height:6px;border-radius:12px;background:#ffffff2a;position:relative;touch-action:pan-y;cursor:pointer}.seek{margin:0 0 6px}.fill,.vfill{position:absolute;left:0;top:0;height:100%;background:var(--a);border-radius:12px}.fill{width:0}.times{color:#a09cbd;font-size:10px;}.controls{margin:15px 0 12px;gap:6px;justify-content:space-around}.controls button,.foot button{border:0;background:transparent;color:#c3b9da;font:inherit;padding:8px;min-width:37px;border-radius:9px}.controls .active{color:var(--a)}.controls .jump{font-weight:700}.controls .big{margin:0 3px;background:var(--a);color:#17132b;border-radius:50%;width:49px;height:49px;font-size:21px;}.foot{border-top:1px solid #ffffff17;padding-top:12px;gap:12px;color:#a6a4c3;font-size:11px}.foot .vol{flex:1;margin-right:0}.vfill{width:70%}.foot button{color:var(--a);font-size:12px;padding:0;min-width:22px}.status{margin-top:8px;text-align:center;color:#a09cbd;font-size:10px;min-height:13px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes eq{to{height:17px}}</style><div class="head"><span class="brand">◉ NOCTURNE <em>PLAYER</em></span><span class="pill" id="indicator">OFFLINE MIX</span></div><div class="main"><div class="cover" id="cover"><div class="disc"></div><div class="bars"><b></b><b></b><b></b><b></b><b></b></div></div><div class="info"><div class="eyebrow" id="count">NOW PLAYING · 01 / 03</div><h2 id="title">Neon Nights</h2><p class="artist" id="artist">Original · Synthwave</p><span class="label" id="tag">96 BPM · instrumental</span></div></div><div class="seek" id="seek"><div class="fill" id="fill"></div></div><div class="times"><span id="current">0:00</span><span id="duration">0:40</span></div><div class="controls"><button id="shuffle" >⤨</button><button class="jump" id="prev" >◀◀</button><button class="big" id="play" >▶</button><button class="jump" id="next" >▶▶</button><button id="repeat" >↻</button></div><div class="foot"><span id="speaker">♫</span><div class="vol" id="volume"><div class="vfill" id="vfill"></div></div><button id="mode" >✦</button></div><div class="status" id="status">Три оригинальных трека · нажми ▶</div><script>const $=id=>document.getElementById(id),TW=window.TelegramWidget;const songs=[{name:'Neon Nights',style:'Synthwave',bpm:96,roots:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],color:'#a38cff'},{name:'City Lights',style:'Lo-fi beats',bpm:84,roots:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],color:'#65d8c2'},{name:'First Light',style:'Chill house',bpm:110,roots:[[62,65,69],[58,62,65],[53,57,60],[60,64,67]],color:'#ffb878'}];let ix=0,pos=0,playing=false,shuffle=false,repeat=false,vol=.7,ctx=null,master=null,voice=null,clock=null,start=0,step=0,last=0;const HAS_AUDIO=!!(window.AudioContext||window.webkitAudioContext);const dur=()=>16*240/songs[ix].bpm,beat=()=>60/songs[ix].bpm/4;const fmt=n=>Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0');const haptic=()=>{if(TW)TW.HapticFeedback.selectionChanged()};function ui(){let s=songs[ix],d=dur();document.body.style.setProperty('--a',colors?['#a38cff','#65d8c2','#ffb878','#f688b9'][colors%4]:s.color);document.body.classList.toggle('playing',playing);$('title').textContent=s.name;$('artist').textContent='Original · '+s.style;$('count').textContent='NOW PLAYING · '+String(ix+1).padStart(2,'0')+' / 03';$('tag').textContent=s.bpm+' BPM · instrumental';$('current').textContent=fmt(Math.min(pos,d));$('duration').textContent=fmt(d);$('fill').style.width=(100*Math.min(1,pos/d))+'%';$('play').textContent=playing?'Ⅱ':'▶';$('shuffle').classList.toggle('active',shuffle);$('repeat').classList.toggle('active',repeat);$('vfill').style.width=100*vol+'%';$('indicator').textContent=HAS_AUDIO?'OFFLINE MIX':'VISUAL DEMO';}function message(m){$('status').textContent=m}function ensure(){if(!HAS_AUDIO)return false;if(!ctx){const A=window.AudioContext||window.webkitAudioContext;ctx=new A;master=ctx.createGain();master.gain.value=vol*.7;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return true}const hz=n=>440*Math.pow(2,(n-69)/12);function tone(n,t,l,type,amp,release=.11){if(!voice)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(hz(n),t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(amp,t+.014);g.gain.setValueAtTime(amp,t+Math.max(.02,l-.07));g.gain.exponentialRampToValueAtTime(.0001,t+l+release);o.connect(g);g.connect(voice);o.start(t);o.stop(t+l+release+.03)}function kick(t){if(!voice)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.13);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(voice);o.start(t);o.stop(t+.24)}function drum(t,s){tone(s?51:95,t,s?.15:.045,s?'sawtooth':'square',s?.013:.003,.02)}function synthStep(k,t){let s=songs[ix],b=Math.floor(k/16),j=k%16,ch=s.roots[b%4],q=beat();if(j===0||j===8)kick(t);if(j===4||j===12)drum(t,true);if(j%2===0)drum(t,false);if(j===0||j===8){for(let x of ch)tone(x,t,q*7.8,'sine',.025,.18)}if(j%4===0)tone(ch[0]-24,t,q*3.5,'triangle',.085);if([2,6,10,14].includes(j))tone(ch[(j/4|0)%3]+12+(b%4===3?2:0),t,q*2.5,'triangle',.033,.07)}function clearVoice(){if(voice&&ctx){voice.gain.setTargetAtTime(.00001,ctx.currentTime,.01);voice=null}}function rebase(){if(!ctx||!playing)return;clearVoice();voice=ctx.createGain();voice.gain.value=1;voice.connect(master);start=ctx.currentTime-pos;step=Math.max(0,Math.floor(pos/beat()));}function pause(){if(ctx&&playing)pos=Math.min(dur(),Math.max(0,ctx.currentTime-start));playing=false;clearVoice();ui();message('Пауза')}function play(){if(playing){pause();return}playing=true;if(ensure()){rebase();message('Играет · звук включён')}else message('В Telegram нет звука — визуальный режим');ui();haptic()}function choose(n){clearVoice();ix=(n+3)%3;pos=0;if(playing&&ctx)rebase();ui();message(playing?(HAS_AUDIO?'Играет · звук включён':'Визуальный режим'):'Выбран '+songs[ix].name);haptic()}function next(){choose(shuffle?(ix+1+Math.floor(Math.random()*2))%3:ix+1)}$('play').onclick=play;$('next').onclick=next;$('prev').onclick=()=>{if(pos>3){seekTo(0)}else choose(ix+2)};$('shuffle').onclick=()=>{shuffle=!shuffle;ui();haptic()};$('repeat').onclick=()=>{repeat=!repeat;ui();haptic()};function seekTo(p){pos=Math.max(0,Math.min(dur(),p));if(playing&&ctx)rebase();ui()}function slider(id,set){const el=$(id);function move(e){let r=el.getBoundingClientRect();set(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)))}el.addEventListener('click',move);el.addEventListener('pointermove',e=>{if(e.buttons===1)move(e)})}slider('seek',v=>seekTo(v*dur()));slider('volume',v=>{vol=v;if(master&&ctx)master.gain.setTargetAtTime(vol*.7,ctx.currentTime,.015);ui()});let colors=0;$('mode').onclick=()=>{colors++;document.body.style.setProperty('--a',['#a38cff','#65d8c2','#ffb878','#f688b9'][colors%4]);haptic()};setInterval(()=>{if(!playing)return;if(ctx){pos=ctx.currentTime-start;const lim=ctx.currentTime+.23;while(step<256&&start+step*beat()<lim&&step*beat()<dur()){let t=start+step*beat();if(t>=ctx.currentTime-.03)synthStep(step,t);step++}}else pos+=.08;if(pos>=dur()){if(repeat){seekTo(0)}else next()}ui()},80);ui();</script></html>
